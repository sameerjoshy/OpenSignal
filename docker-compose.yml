version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: opensignal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: opensignal
      POSTGRES_PASSWORD: opensignal
      POSTGRES_DB: opensignal
    ports:
      - "5432:5432"
    volumes:
      - opensignal_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: opensignal-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opensignal-backend
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://opensignal:opensignal@db:5432/opensignal
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret-change-me
      ENCRYPTION_KEY: ZGV2LWVuY3J5cHRpb24ta2V5LTI1Ni1iaXRzLXh4eA==
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      SUPABASE_URL: ""
      SUPABASE_ANON_KEY: ""
      SUPABASE_SERVICE_ROLE_KEY: ""
      BEDROCK_REGION: us-east-1
      BEDROCK_MODEL_ID: anthropic.claude-3-5-sonnet-20240620-v1:0
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: opensignal-worker
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker -l info
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://opensignal:opensignal@db:5432/opensignal
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: dev-jwt-secret-change-me
      ENCRYPTION_KEY: ZGV2LWVuY3J5cHRpb24ta2V5LTI1Ni1iaXRzLXh4eA==
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      BEDROCK_REGION: us-east-1
    depends_on:
      - db
      - redis

volumes:
  opensignal_pgdata: